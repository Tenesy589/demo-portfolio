# Host-level nginx vhost for the demo portfolio. Everything goes to the demo
# gateway on 127.0.0.1:7100, which routes by subdomain. Certbot adds the TLS
# part (listen 443, certificates, http→https redirect) on first run.
map $http_upgrade $demo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.glowly.uz *.demo.glowly.uz;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (TaskFlow live sync) and Server-Sent Events (PulseCheck)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $demo_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
