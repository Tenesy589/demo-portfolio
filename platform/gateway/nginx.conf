# Single entry point. Host-based routing on *.localhost (resolves to 127.0.0.1 in modern browsers).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Landing page + live status
server {
  listen 80 default_server;
  server_name localhost;
  root /usr/share/nginx/html;

  location = /status {
    set $pulse http://pulse-api:8080;
    proxy_pass $pulse/api/monitors;
  }
  location / { try_files $uri /index.html; }
}

server {
  listen 80;
  server_name ~^taskflow\.;
  location / {
    set $up http://taskflow-web:80;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}

server {
  listen 80;
  server_name ~^admin\.;
  client_max_body_size 25m;
  location / { set $up http://adminhub-web:80; proxy_pass $up; }
}

server {
  listen 80;
  server_name ~^liveboard\.;
  location / {
    set $up http://liveboard-lb:80;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name ~^insight\.;
  location / { set $up http://insight-api:8000; proxy_pass $up; }
}

server {
  listen 80;
  server_name ~^pulse\.;
  location / {
    set $up http://pulse-api:8080;
    proxy_pass $up;
    proxy_buffering off; # Server-Sent Events
    proxy_read_timeout 1h;
  }
}

server {
  listen 80;
  server_name ~^grafana\.;
  location / { set $up http://pulse-grafana:3000; proxy_pass $up; proxy_set_header Host $host; }
}
