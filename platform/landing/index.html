<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevPlatform</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
<style>
  :root { --bg:#f7f7fb; --card:#fff; --text:#12131a; --muted:#646a80; --border:#e4e5ee; --accent:#6d5efc; --up:#16a34a; --down:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0c12; --card:#14151f; --text:#ececf4; --muted:#9499ad; --border:#242636; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px; }
  header { padding:64px 0 32px; }
  h1 { font-size:clamp(32px,6vw,52px); line-height:1.05; margin:0 0 12px; letter-spacing:-.02em; }
  h1 span { background:linear-gradient(90deg,var(--accent),#22c1c3); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lead { color:var(--muted); font-size:18px; max-width:720px; margin:0; }
  code { background:var(--card); border:1px solid var(--border); padding:2px 8px; border-radius:6px; font-size:14px; }
  h2 { font-size:22px; margin:48px 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:10px; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgb(0 0 0 / 8%); }
  .card h3 { margin:0; font-size:18px; display:flex; align-items:center; gap:8px; }
  .card p { margin:0; color:var(--muted); font-size:14px; }
  .lang { font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; color:#fff; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tags span { font-size:12px; border:1px solid var(--border); border-radius:99px; padding:1px 9px; color:var(--muted); }
  .links { display:flex; gap:12px; margin-top:auto; padding-top:6px; font-size:14px; flex-wrap:wrap; }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  .status { margin-left:auto; width:10px; height:10px; border-radius:50%; background:var(--border); }
  .status.up { background:var(--up); box-shadow:0 0 0 4px #16a34a22; } .status.down { background:var(--down); }
  .arch { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; overflow-x:auto; }
  .arch svg { min-width:760px; width:100%; height:auto; font:13px ui-sans-serif,system-ui; }
  .arch rect { fill:var(--bg); stroke:var(--border); } .arch .hl { stroke:var(--accent); }
  .arch text { fill:var(--text); } .arch .sub { fill:var(--muted); font-size:11px; }
  .arch path { stroke:var(--muted); fill:none; marker-end:url(#arr); } .arch marker path { fill:var(--muted); stroke:none; }
  footer { color:var(--muted); font-size:13px; padding:48px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Six projects. <span>One command.</span></h1>
    <p class="lead">Портфоліо з 6 продакшн-рівня демо-проєктів — Node.js, Python, Go, React, Angular — які працюють окремо або разом як одна платформа. Запуск: <code>docker compose up</code></p>
  </header>

  <h2>Проєкти</h2>
  <div class="grid" id="cards"></div>

  <h2>Архітектура</h2>
  <div class="arch">
    <svg viewBox="0 0 900 330" role="img" aria-label="Architecture diagram">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="hl" x="350" y="10" width="200" height="44" rx="10"/><text x="450" y="37" text-anchor="middle">Gateway · nginx :7100</text>
      <rect x="20" y="100" width="190" height="56" rx="10"/><text x="115" y="124" text-anchor="middle">React TaskFlow</text><text class="sub" x="115" y="142" text-anchor="middle">SPA · WebSocket client</text>
      <rect x="240" y="100" width="190" height="56" rx="10"/><text x="335" y="124" text-anchor="middle">Angular AdminHub</text><text class="sub" x="335" y="142" text-anchor="middle">Signals · RxJS · RBAC</text>
      <rect x="470" y="100" width="190" height="56" rx="10"/><text x="565" y="124" text-anchor="middle">Go PulseCheck API</text><text class="sub" x="565" y="142" text-anchor="middle">REST · SSE · scheduler</text>
      <rect x="690" y="100" width="190" height="56" rx="10"/><text x="785" y="124" text-anchor="middle">Grafana</text><text class="sub" x="785" y="142" text-anchor="middle">dashboards</text>
      <rect x="20" y="200" width="190" height="56" rx="10"/><text x="115" y="224" text-anchor="middle">Node LiveBoard ×2</text><text class="sub" x="115" y="242" text-anchor="middle">NestJS · Socket.IO · BullMQ</text>
      <rect x="240" y="200" width="190" height="56" rx="10"/><text x="335" y="224" text-anchor="middle">Python InsightAPI</text><text class="sub" x="335" y="242" text-anchor="middle">FastAPI · pandas · sklearn</text>
      <rect x="470" y="200" width="190" height="56" rx="10"/><text x="565" y="224" text-anchor="middle">Go Prober (gRPC)</text><text class="sub" x="565" y="242" text-anchor="middle">goroutines · bidi stream</text>
      <rect x="690" y="200" width="190" height="56" rx="10"/><text x="785" y="224" text-anchor="middle">Prometheus</text><text class="sub" x="785" y="242" text-anchor="middle">scrapes all services</text>
      <rect x="20" y="280" width="190" height="40" rx="10"/><text x="115" y="305" text-anchor="middle">Postgres · Redis · Worker</text>
      <rect x="240" y="280" width="190" height="40" rx="10"/><text x="335" y="305" text-anchor="middle">Postgres · Redis · Celery</text>
      <rect x="470" y="280" width="190" height="40" rx="10"/><text x="565" y="305" text-anchor="middle">Postgres</text>
      <path d="M400 54 L115 98"/><path d="M430 54 L335 98"/><path d="M470 54 L565 98"/><path d="M500 54 L785 98"/>
      <path d="M115 156 L115 198"/><path d="M335 156 L335 198"/><path d="M565 156 L565 198"/><path d="M785 156 L785 198"/>
      <path d="M115 256 L115 278"/><path d="M335 256 L335 278"/><path d="M565 256 L565 278"/>
      <path d="M660 228 L688 228"/>
    </svg>
  </div>

  <footer>PulseCheck моніторить кожен сервіс платформи — індикатори на картках оновлюються наживо.</footer>
</div>
<script>
const P = location.port ? ':' + location.port : '';
// Same page works locally (taskflow.localhost:7100) and in production (taskflow.demo.example.com).
const sub = (name) => `${location.protocol}//${name}.${location.hostname}${P}`;
const LOCAL = location.hostname === 'localhost';
const projects = [
  { id: 'liveboard', name: 'LiveBoard', lang: 'Node.js', color: '#3c873a', desc: 'Real-time Kanban бекенд: WebSocket, горизонтальне масштабування через Redis, черги задач, стрімінг.',
    tags: ['NestJS', 'Socket.IO', 'Redis adapter', 'BullMQ', 'Prisma', 'Streams'], health: 'liveboard-lb/health',
    links: [['Swagger', sub('liveboard') + '/docs'], [':7101', 'http://localhost:7101/docs']] },
  { id: 'insight', name: 'InsightAPI', lang: 'Python', color: '#3776ab', desc: 'CRM + аналітика + ML: pandas-когорти, прогноз виручки, модель відтоку з поясненнями, Celery.',
    tags: ['FastAPI', 'pandas', 'scikit-learn', 'Celery', 'SQLAlchemy 2', 'asyncio'], health: 'insight-api:8000/health',
    links: [['Swagger', sub('insight') + '/docs'], [':7103', 'http://localhost:7103/docs']] },
  { id: 'pulse', name: 'PulseCheck', lang: 'Go', color: '#00add8', desc: 'Високонавантажений моніторинг: goroutines, bidi gRPC stream, SSE, Prometheus. Образ ~15 MB зі scratch.',
    tags: ['gRPC', 'goroutines', 'channels', 'SSE', 'Prometheus', 'cobra CLI'], health: 'pulse-grafana:3000/api/health',
    links: [['Dashboard', sub('pulse') + ''], ['Grafana', sub('grafana') + ''], [':7105', 'http://localhost:7105']] },
  { id: 'taskflow', name: 'TaskFlow', lang: 'React', color: '#149eca', desc: 'Kanban з drag & drop, optimistic UI, live-синхронізацією, presence і «хто редагує».',
    tags: ['React 19', 'TanStack Query', 'Zustand', 'dnd-kit', 'Tailwind 4', 'Vite'], health: 'taskflow-web/',
    links: [['Відкрити', sub('taskflow') + ''], [':7102', 'http://localhost:7102']] },
  { id: 'adminhub', name: 'AdminHub', lang: 'Angular', color: '#dd0031', desc: 'Enterprise адмінка: zoneless + Signals, RxJS, складні типізовані форми, ролі, i18n UA/EN.',
    tags: ['Angular 20', 'Signals', 'RxJS', 'Reactive Forms', 'Guards', 'Chart.js'], health: 'adminhub-web/',
    links: [['Відкрити', sub('admin') + ''], [':7104', 'http://localhost:7104']] },
  { id: 'platform', name: 'DevPlatform', lang: 'DevOps', color: '#6d5efc', desc: 'Все разом: Compose include, nginx gateway, єдиний моніторинг, CI на GitHub Actions.',
    tags: ['Docker Compose', 'nginx', 'Prometheus', 'Grafana', 'GitHub Actions'], health: null, links: [] },
];
document.getElementById('cards').innerHTML = projects.map((p) => `
  <article class="card">
    <h3><span class="lang" style="background:${p.color}">${p.lang}</span>${p.name}<span class="status" id="st-${p.id}" title="status"></span></h3>
    <p>${p.desc}</p>
    <div class="tags">${p.tags.map((t) => `<span>${t}</span>`).join('')}</div>
    <div class="links">${p.links.filter(([t]) => LOCAL || !(t.startsWith(':') || t === 'Grafana')).map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t} →</a>`).join('')}</div>
  </article>`).join('');

async function refresh() {
  try {
    const monitors = await (await fetch('/status')).json();
    for (const p of projects) {
      const el = document.getElementById('st-' + p.id);
      if (!p.health) { el.className = 'status up'; continue; }
      const m = monitors.find((m) => m.url.includes(p.health));
      el.className = 'status ' + (m?.last ? (m.last.up ? 'up' : 'down') : '');
      el.title = m?.last ? `${m.last.up ? 'UP' : 'DOWN'} · ${m.last.latency_ms} ms · uptime ${m.uptime_pct.toFixed(1)}%` : 'no data';
    }
  } catch {}
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
