syntax = "proto3";

package pulse.v1;

option go_package = "github.com/demo/pulsecheck/gen/pulse/v1;pulsev1";

// Prober performs HTTP health checks on behalf of the scheduler.
service Prober {
  // One-off check (used by the CLI and the ad-hoc /api/check endpoint).
  rpc Probe(ProbeRequest) returns (ProbeResult);
  // Long-lived bidirectional stream: the scheduler pushes requests, the prober
  // streams back results as soon as each one finishes (out of order).
  rpc ProbeStream(stream ProbeRequest) returns (stream ProbeResult);
}

message ProbeRequest {
  string id = 1;
  string url = 2;
  int32 timeout_ms = 3;
  int32 expect_status = 4; // 0 = any 2xx/3xx
}

message ProbeResult {
  string id = 1;
  string url = 2;
  bool up = 3;
  int32 status_code = 4;
  int64 latency_ms = 5;
  string error = 6;
  int32 tls_days_left = 7; // -1 when not HTTPS
  int64 checked_at_unix_ms = 8;
  string prober = 9;
}
