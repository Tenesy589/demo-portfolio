<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PulseCheck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💓</text></svg>" />
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --up:#16a34a; --down:#dc2626; --accent:#0ea5e9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--card); position:sticky; top:0; }
  h1 { font-size:18px; margin:0; } .muted { color:var(--muted); } .spacer { flex:1; }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); } .dot.on { background:var(--up); animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  main { max-width:1200px; margin:0 auto; padding:24px 16px; display:grid; gap:16px; }
  .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .summary strong { display:block; font-size:24px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  input { flex:1 1 220px; } button { background:var(--accent); color:#fff; border:0; cursor:pointer; font-weight:600; }
  .monitors { display:grid; gap:10px; }
  .mon { display:grid; grid-template-columns: 14px minmax(140px,1.2fr) 2.5fr repeat(3, 72px) 28px; align-items:center; gap:12px; }
  .mon .name { overflow:hidden; } .mon .name small { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status { width:12px; height:12px; border-radius:50%; background:var(--muted); } .status.up { background:var(--up); } .status.down { background:var(--down); box-shadow:0 0 0 4px #dc262633; }
  .bars { display:flex; gap:2px; height:28px; align-items:flex-end; }
  .bars i { flex:1; min-width:2px; border-radius:2px; background:var(--up); opacity:.85; } .bars i.down { background:var(--down); height:100% !important; }
  .num { text-align:right; font-variant-numeric:tabular-nums; } .num small { display:block; color:var(--muted); font-size:11px; }
  .del { background:none; color:var(--muted); padding:0; }
  .incidents li { padding:6px 0; border-bottom:1px solid var(--border); list-style:none; } ul { padding:0; margin:0; }
  @media (max-width:720px) { .mon { grid-template-columns: 14px 1fr 64px 28px; } .mon .bars, .mon .num:nth-of-type(n+2) { display:none; } }
</style>
</head>
<body>
<header>
  <h1>💓 PulseCheck</h1><span class="muted">Go · gRPC · goroutines</span><span class="spacer"></span>
  <span class="live"><span class="dot" id="dot"></span><span id="rate">connecting…</span></span>
</header>
<main>
  <section class="summary">
    <div class="card"><span class="muted">Monitors</span><strong id="s-total">–</strong></div>
    <div class="card"><span class="muted">Up</span><strong id="s-up" style="color:var(--up)">–</strong></div>
    <div class="card"><span class="muted">Down</span><strong id="s-down" style="color:var(--down)">–</strong></div>
    <div class="card"><span class="muted">Avg latency</span><strong id="s-lat">–</strong></div>
  </section>
  <form class="card" id="add">
    <input name="url" placeholder="https://example.com/health" required type="url" />
    <input name="name" placeholder="Name (optional)" style="flex:0 1 180px" />
    <input name="interval_seconds" type="number" min="5" value="10" style="flex:0 0 90px" title="Interval, s" />
    <button>Add monitor</button>
  </form>
  <section class="card monitors" id="monitors"></section>
  <section class="card"><h3 style="margin-top:0">Incidents</h3><ul class="incidents" id="incidents"></ul></section>
  <p class="muted" style="text-align:center">Grafana: <a id="grafana-link" href="http://localhost:7106" target="_blank">open</a> · Prometheus metrics: <a href="/metrics">/metrics</a> · Live stream: <a href="/api/events">/api/events</a></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
if (location.hostname.startsWith('pulse.')) $('grafana-link').href = location.href.replace('//pulse.', '//grafana.').split('?')[0].replace(/\/$/, '');
const state = { monitors: new Map(), history: new Map() };
let events = 0;

async function load() {
  const list = await (await fetch('/api/monitors')).json();
  state.monitors = new Map(list.map((m) => [m.id, m]));
  await Promise.all(list.map(async (m) => {
    const d = await (await fetch(`/api/monitors/${m.id}`)).json();
    state.history.set(m.id, d.history ?? []);
  }));
  render();
  loadIncidents();
}

async function loadIncidents() {
  const list = await (await fetch('/api/incidents')).json();
  $('incidents').innerHTML = list.length ? list.slice(0, 10).map((i) =>
    `<li>${i.resolved_at ? '✅' : '🔴'} <b>${esc(i.monitor_name)}</b> — ${esc(i.cause)} <span class="muted">· ${new Date(i.started_at).toLocaleTimeString()}${i.resolved_at ? ' → ' + new Date(i.resolved_at).toLocaleTimeString() : ' (ongoing)'}</span></li>`).join('') : '<li class="muted">No incidents 🎉</li>';
}

function stats(h) {
  if (!h.length) return {};
  const up = h.filter((r) => r.up).length;
  const lat = h.map((r) => r.latency_ms).sort((a, b) => a - b);
  return { last: h.at(-1), uptime: (up / h.length) * 100, avg: Math.round(lat.reduce((a, b) => a + b, 0) / lat.length), p95: lat[Math.min(lat.length - 1, Math.floor(lat.length * 0.95))] };
}

function render() {
  let up = 0, down = 0, latSum = 0, latN = 0;
  $('monitors').innerHTML = [...state.monitors.values()].map((m) => {
    const h = (state.history.get(m.id) ?? []).slice(-60);
    const s = stats(h);
    if (s.last) { s.last.up ? up++ : down++; latSum += s.avg; latN++; }
    const max = Math.max(...h.map((r) => r.latency_ms), 1);
    return `<div class="mon">
      <span class="status ${s.last ? (s.last.up ? 'up' : 'down') : ''}" title="${esc(s.last?.error ?? '')}"></span>
      <span class="name"><b>${esc(m.name)}</b><small>${esc(m.url)}</small></span>
      <span class="bars">${h.map((r) => `<i class="${r.up ? '' : 'down'}" style="height:${Math.max(8, (r.latency_ms / max) * 100)}%" title="${r.latency_ms} ms · ${r.status_code || r.error}"></i>`).join('')}</span>
      <span class="num">${s.uptime?.toFixed(1) ?? '–'}%<small>uptime</small></span>
      <span class="num">${s.avg ?? '–'}<small>avg ms</small></span>
      <span class="num">${s.p95 ?? '–'}<small>p95 ms</small></span>
      <button class="del" title="Delete" onclick="del(${m.id})">✕</button>
    </div>`;
  }).join('') || '<p class="muted">No monitors yet</p>';
  $('s-total').textContent = state.monitors.size;
  $('s-up').textContent = up;
  $('s-down').textContent = down;
  $('s-lat').textContent = latN ? Math.round(latSum / latN) + ' ms' : '–';
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function del(id) { await fetch(`/api/monitors/${id}`, { method: 'DELETE' }); state.monitors.delete(id); render(); }

$('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  body.interval_seconds = Number(body.interval_seconds);
  const res = await fetch('/api/monitors', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) return alert((await res.json()).error);
  e.target.reset(); load();
});

// Live updates over Server-Sent Events; render at most once per animation frame.
let pending = false;
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => $('dot').classList.add('on');
  es.onerror = () => $('dot').classList.remove('on');
  es.addEventListener('result', (e) => {
    const r = JSON.parse(e.data);
    const h = state.history.get(r.monitor_id) ?? [];
    const prev = h.at(-1);
    h.push(r); if (h.length > 120) h.shift();
    state.history.set(r.monitor_id, h);
    if (!state.monitors.has(r.monitor_id)) load();
    if (prev && prev.up !== r.up) loadIncidents();
    events++;
    if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
  });
}
setInterval(() => { $('rate').textContent = `${events} checks/10s`; events = 0; }, 10000);
load().then(connect);
</script>
</body>
</html>
