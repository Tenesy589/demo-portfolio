name: pulsecheck

services:
  pulse-db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: pulse, POSTGRES_PASSWORD: pulse, POSTGRES_DB: pulse }
    volumes: [pulse-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulse"], interval: 5s, retries: 10 }

  pulse-prober:
    build: { context: ., args: { TARGET: prober } }
    image: demo/pulse-prober:latest
    environment:
      GRPC_ADDR: ":9000"
      PROBER_CONCURRENCY: "128"

  pulse-api:
    build: { context: ., args: { TARGET: api } }
    image: demo/pulse-api:latest
    environment:
      HTTP_ADDR: ":8080"
      PROBER_ADDR: pulse-prober:9000
      DATABASE_URL: postgres://pulse:pulse@pulse-db:5432/pulse?sslmode=disable
      PUBLIC_URL: http://pulse-api:8080
      SEED_URLS: ${PULSE_SEED_URLS:-}
    ports: ["${PULSE_PORT:-7105}:8080"]
    depends_on:
      pulse-db: { condition: service_healthy }
      pulse-prober: { condition: service_started }

  # CLI, on demand: docker compose run --rm pulsectl check https://go.dev
  pulsectl:
    build: { context: ., args: { TARGET: pulsectl } }
    image: demo/pulsectl:latest
    profiles: [cli]
    environment: { PULSE_API: "http://pulse-api:8080", PULSE_PROBER: "pulse-prober:9000" }

  pulse-prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["${PROMETHEUS_PORT:-7107}:9090"]

  pulse-grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pulsecheck.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-7106}:3000"]
    depends_on: [pulse-prometheus]

volumes:
  pulse-db:
