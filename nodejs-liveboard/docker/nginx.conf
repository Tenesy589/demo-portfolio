# Round-robin across API replicas. Docker DNS returns every replica's IP;
# `resolver` + variable upstream makes nginx pick up scaled replicas.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  set $api http://liveboard-api:3000;

  location /socket.io/ {
    # Clients use the WebSocket transport only, so no sticky sessions are needed:
    # cross-instance broadcasting is handled by the Redis adapter.
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off; # stream CSV export as it's produced
  }
}
