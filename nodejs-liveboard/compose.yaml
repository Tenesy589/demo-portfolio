name: liveboard

x-api-env: &api-env
  DATABASE_URL: postgresql://liveboard:liveboard@liveboard-db:5432/liveboard
  REDIS_URL: redis://liveboard-redis:6379
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}

services:
  liveboard-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: liveboard
      POSTGRES_PASSWORD: liveboard
      POSTGRES_DB: liveboard
    volumes: [liveboard-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveboard"]
      interval: 5s
      retries: 10

  liveboard-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # One-shot: apply migrations + seed, then exit. API waits for it to succeed.
  liveboard-migrate:
    build: .
    image: ${IMAGE_PREFIX:-demo}/liveboard:${IMAGE_TAG:-latest}
    environment: *api-env
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/seed.js"]
    depends_on:
      liveboard-db: { condition: service_healthy }

  liveboard-api:
    image: ${IMAGE_PREFIX:-demo}/liveboard:${IMAGE_TAG:-latest}
    environment: *api-env
    deploy:
      replicas: 2 # two instances sharing state via Redis
    depends_on:
      liveboard-migrate: { condition: service_completed_successfully }
      liveboard-redis: { condition: service_healthy }

  liveboard-worker:
    image: ${IMAGE_PREFIX:-demo}/liveboard:${IMAGE_TAG:-latest}
    environment: *api-env
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on:
      liveboard-migrate: { condition: service_completed_successfully }
      liveboard-redis: { condition: service_healthy }

  liveboard-lb:
    image: nginx:1.27-alpine
    volumes: [./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["${LIVEBOARD_PORT:-7101}:80"]
    depends_on:
      liveboard-api: { condition: service_healthy }

volumes:
  liveboard-db:
